<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لوحة التحكم - عقارات المتميزة</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 12px; }
        input, select, textarea { width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; }
        .btn { width: 100%; padding: 10px; background: #1a2a6c; color: white; border: none; cursor: pointer; border-radius: 5px; }
        .estate-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>
    <div id="loginScreen" style="text-align:center; padding-top:50px;">
        <h3>دخول الأدمن</h3>
        <input type="password" id="pass" placeholder="كلمة السر" style="width:200px;">
        <button onclick="login()" class="btn" style="width:200px;">دخول</button>
    </div>

    <div id="mainContent" class="container" style="display:none;">
        <h3>تعديل رقم الهاتف</h3>
        <input type="text" id="globalPhone" placeholder="رقم الواتساب">
        <button onclick="updatePhone()" class="btn">حفظ الرقم</button>
        <hr>
        <h3>إضافة عقار جديد</h3>
        <form id="estateForm">
            <input type="text" id="title" placeholder="عنوان العقار" required>
            <select id="governorate">
                <option value="الجيزة" selected>الجيزة</option>
                <option value="القاهرة">القاهرة</option>
                <option value="الإسكندرية">الإسكندرية</option>
                <!-- باقي المحافظات -->
            </select>
            <select id="purpose"><option value="للبيع">للبيع</option><option value="للإيجار">للإيجار</option></select>
            <input type="text" id="price" placeholder="السعر" required>
            <textarea id="description" placeholder="التفاصيل"></textarea>
            <input type="file" id="imageFiles" multiple required>
            <button type="submit" class="btn">نشر العقار</button>
        </form>
        <h3>العقارات الحالية</h3>
        <div id="estatesList"></div>
    </div>

    <script>
        let db;
        function login() {
            if(document.getElementById('pass').value === "2233") {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
                firebase.initializeApp({databaseURL: "https://cort-6368a-default-rtdb.firebaseio.com"});
                db = firebase.database();
                renderList();
            } else { alert("خطأ!"); }
        }
        function updatePhone() { db.ref('settings/globalPhone').set(document.getElementById('globalPhone').value); alert("تم الحفظ"); }
        function renderList() {
            db.ref('properties').on('value', snap => {
                let html = '';
                snap.forEach(c => html += `<div class="estate-item">${c.val().title} <button onclick="db.ref('properties/${c.key}').remove()">حذف</button></div>`);
                document.getElementById('estatesList').innerHTML = html;
            });
        }
        document.getElementById('estateForm').addEventListener('submit', async(e) => {
            e.preventDefault();
            const imgs = [];
            const files = document.getElementById('imageFiles').files;
            for(let f of files) {
                const reader = new FileReader();
                reader.readAsDataURL(f);
                imgs.push(await new Promise(r => reader.onload = () => r(reader.result)));
            }
            db.ref('properties').push({title: document.getElementById('title').value, governorate: document.getElementById('governorate').value, purpose: document.getElementById('purpose').value, price: document.getElementById('price').value, description: document.getElementById('description').value, images: imgs});
            alert("تم النشر!");
        });
    </script>
</body>
</html>
