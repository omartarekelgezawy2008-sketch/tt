<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <!-- التعديل الأهم لتثبيت الشاشة على الموبايل -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>عقارات المتميزة بالجيزة</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        /* تثبيت الخط والألوان لمنع التغيير المفاجئ */
        body { font-family: 'Cairo', sans-serif; background-color: #f1f5f9; margin: 0; padding: 0; overflow-x: hidden; }
        
        /* جعل الحاوية ثابتة في كل الأجهزة */
        .container { max-width: 900px; margin: auto; padding: 20px; box-sizing: border-box; }
        
        /* تثبيت أحجام الكروت */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        
        .card { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .slider-container { width: 100%; height: 200px; background: #ddd; position: relative; }
        .slider-img { width: 100%; height: 100%; object-fit: cover; }

        /* أزرار التواصل */
        .btn { display: block; width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; text-align: center; text-decoration: none; font-weight: bold; }
        .wa-btn { background: #25D366; color: white; }
        .call-btn { background: #c5a059; color: white; }

        /* معالجة شاشة الترحيب لتكون ثابتة */
        #splash-screen { position: fixed; top:0; left:0; width:100%; height:100%; background: #0f172a; z-index: 9999; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <!-- (باقي كود الموقع السابق بنفس التنسيقات المحدثة) -->
    <!-- تم إضافة Viewport المحدث في الأعلى لحل مشكلة الموبايل -->
</body>
</html>
